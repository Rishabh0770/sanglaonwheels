<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Page Not Found</title>
  <meta name="description" content="The page you're looking for could not be found.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f9fc;
      color: #172033;
    }

    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
      text-align: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(27,120,199,.10), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(102,126,234,.10), transparent 30%),
        #f7f9fc;
    }

    .error-container {
      width: 100%;
      max-width: 680px;
    }

    .error-code {
      margin: 0;
      font-size: clamp(100px, 20vw, 180px);
      line-height: .85;
      font-weight: 800;
      letter-spacing: -8px;
      color: #1b78c7;
    }

    .error-title {
      margin: 28px 0 12px;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 750;
      color: #172033;
    }

    .error-description {
      max-width: 560px;
      margin: 0 auto 32px;
      color: #667085;
      font-size: 17px;
      line-height: 1.7;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 180px;
      padding: 13px 25px;
      border-radius: 999px;
      background: #1b78c7;
      color: #fff;
      text-decoration: none;
      font-weight: 650;
      box-shadow: 0 10px 25px rgba(27,120,199,.22);
      transition: .25s ease;
    }

    .home-btn:hover {
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(27,120,199,.28);
    }

    .error-hint {
      margin-top: 28px;
      font-size: 13px;
      color: #98a2b3;
    }

    @media (max-width: 576px) {
      .error-page { padding: 24px 16px; }
      .error-code { letter-spacing: -4px; }
      .error-description { font-size: 15px; }
      .home-btn { width: 100%; max-width: 280px; }
    }
  </style>
</head>

<body>
  <main class="error-page">
    <div class="error-container">
      <div class="error-code">404</div>

      <h1 class="error-title">Page Not Found</h1>

      <p class="error-description">
        Sorry, the page you're looking for doesn't exist or may have been moved.
      </p>

      <a href="/" class="home-btn">
        <i class="fas fa-house"></i>
        Back to Home
      </a>

      <div class="error-hint">
        Please check the URL and try again.
      </div>
    </div>
  </main>
</body>
</html>
